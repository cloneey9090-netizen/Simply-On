name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências Python
        run: |
          pip install -r requirements.txt

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          cache: true

      - name: Instalar Flet CLI
        run: flutter pub global activate flet_cli

      - name: Gerar APK
        run: |
          flet build apk --module-name painel

      - name: Upload APK (se sucesso)
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/

