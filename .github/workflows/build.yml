name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências Python
        run: |
          pip install -r requirements.txt

      - name: Verificar pyproject.toml (debug)
        run: |
          echo "=== CONTEÚDO DO pyproject.toml ==="
          cat pyproject.toml || echo "⚠️ Arquivo pyproject.toml não encontrado!"
          echo "=== VERIFICANDO PASTA ASSETS ==="
          ls -la assets/ || echo "⚠️ Pasta assets não encontrada!"
          echo "=== FIM ==="

      - name: Baixar e embutir cloudflared para assets do Android
        run: |
          mkdir -p assets/bin
          curl -L --output assets/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64
          chmod +x assets/bin/cloudflared

      - name: Setup Flutter (versão compatível)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: false

      - name: Gerar APK com Flet (forçando nome e ícone)
        run: |
          flet build apk --module-name painel --app-name "SimplyON" --icon assets/icone.png

      - name: Limpar cache e builds antigos (após o build)
        if: always()
        run: |
          rm -rf ~/.pub-cache
          rm -rf ~/.flutter

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/
