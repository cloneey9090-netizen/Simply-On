name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências Python
        run: |
          pip install -r requirements.txt

      - name: Verificar pyproject.toml (debug)
        run: |
          echo "=== CONTEÚDO DO pyproject.toml ==="
          cat pyproject.toml || echo "⚠️ Arquivo não encontrado!"
          echo "=== ARQUIVOS NA PASTA ASSETS ==="
          ls -la assets/ || echo "⚠️ Pasta assets não encontrada!"
          echo "=== FIM ==="

      - name: Baixar e embutir cloudflared para assets do Android
        run: |
          mkdir -p assets/bin
          curl -L --output assets/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64
          chmod +x assets/bin/cloudflared

      - name: Setup Flutter (versão compatível)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: false

      - name: Criar pubspec.yaml e configurar ícone manualmente
        run: |
          # Cria o pubspec.yaml
          cat > pubspec.yaml << EOF
          name: simplyon
          description: Crie seu site em 5 minutos
          version: 1.0.0
          environment:
            sdk: ">=3.0.0 <4.0.0"
          flutter:
            uses-material-design: true
            assets:
              - assets/
          EOF
          
          # Cria a estrutura de ícones do Android
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          
          # Copia o ícone para todas as resoluções
          cp assets/icone.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/icone.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/icone.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/icone.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/icone.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          
          echo "✅ Ícone copiado para todas as resoluções!"

      - name: Gerar APK com Flet
        run: |
          flet build apk --module-name painel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/
