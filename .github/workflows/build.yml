name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências Python
        run: |
          pip install -r requirements.txt

      - name: Baixar e embutir cloudflared para Android
        run: |
          mkdir -p bin
          curl -L --output bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64
          chmod +x bin/cloudflared

      - name: Setup Flutter (versão compatível)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'  # <-- MUDOU PARA 3.24.0
          channel: 'stable'
          cache: true

      - name: Gerar APK com Flet
        run: |
          flet build apk --module-name painel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/
