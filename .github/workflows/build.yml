name: Build APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Debug - mostrar estrutura do projeto
        run: |
          echo "=== ARQUIVOS NA RAIZ ==="
          ls -la
          echo ""
          echo "=== CONTEÚDO DO pyproject.toml ==="
          cat pyproject.toml || echo "⚠️ pyproject.toml não encontrado!"
          echo ""
          echo "=== ARQUIVOS NA PASTA ASSETS ==="
          ls -la assets/ || echo "⚠️ Pasta assets não encontrada!"

      - name: Instalar Flet e dependências
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.25.0
          pip install -e . || echo "⚠️ Nada para instalar via pyproject.toml"

      - name: Setup Flutter (versão compatível)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Gerar APK com Flet
        run: |
          flet build apk --verbose

      - name: Listar APK gerado
        run: |
          echo "=== ARQUIVOS GERADOS ==="
          find build -name "*.apk" -type f

      - name: Renomear APK para nome fixo
        run: |
          mkdir -p output
          cp build/apk/*.apk output/app-release.apk
          ls -la output/

      - name: Upload como Artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-artifact
          path: output/app-release.apk
          if-no-files-found: error

      - name: Publicar como Release (só quando for tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "SimplyON ${{ github.ref_name }}" \
            --notes "Build automático do app SimplyON. Baixe o APK abaixo." \
            output/app-release.apk
