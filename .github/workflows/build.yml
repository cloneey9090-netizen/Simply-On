name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Debug - mostrar estrutura do projeto
        run: |
          echo "=== ARQUIVOS NA RAIZ ==="
          ls -la
          echo ""
          echo "=== CONTEÚDO DO pyproject.toml ==="
          cat pyproject.toml || echo "⚠️ pyproject.toml não encontrado!"
          echo ""
          echo "=== ARQUIVOS NA PASTA ASSETS ==="
          ls -la assets/ || echo "⚠️ Pasta assets não encontrada!"

      - name: Instalar Flet e dependências
        run: |
          python -m pip install --upgrade pip
          pip install flet
          pip install -e . || echo "⚠️ Nada para instalar via pyproject.toml"

      - name: Setup Flutter (versão compatível)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Gerar APK com Flet
        run: |
          flet build apk --verbose

      - name: Listar APK gerado
        run: |
          echo "=== ARQUIVOS GERADOS ==="
          find build -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/*.apk
          if-no-files-found: error
